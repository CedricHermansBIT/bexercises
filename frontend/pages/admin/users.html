<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../js/utils/themeBootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - BITLab Admin</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <style>
        /* Refresh button animation */
        .action-btn.refreshing .refresh-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .action-btn.refreshing {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Auto-refresh toggle */
        .auto-refresh-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            margin-left: 10px;
        }

        .auto-refresh-label input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .auto-refresh-label:hover {
            color: var(--text-primary);
        }

        /* Sidebar header layout */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* Last activity badge styling */
        .user-stats .stat-badge.last-activity {
            font-weight: 500;
            color: var(--accent-color);
        }

        .user-stats .stat-badge.last-activity.recent {
            color: #2ecc71;
        }

        .user-stats .stat-badge.last-activity.old {
            color: var(--text-secondary);
        }

        .user-archive-controls {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-view-toggle {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 0.6rem;
        }

        .user-view-btn {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            font: inherit;
            font-size: 0.8rem;
            padding: 0.35rem 0.5rem;
        }

        .user-view-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--bg-primary);
        }

        .user-search-controls {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-search-controls label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .user-search-count {
            margin-top: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .archive-all-btn {
            justify-content: center;
            width: 100%;
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>
    <!-- Navbar will be rendered by JavaScript -->
    <div id="navbar-container"></div>

    <div class="admin-layout">
        <div class="resize-handle"></div>

        <!-- Sidebar with users list -->
        <div class="admin-sidebar">
            <div class="sidebar-header">
                <button class="action-btn" id="refresh-users-btn" title="Refresh user list">
                    <span class="refresh-icon">🔄</span> Refresh
                </button>
                <label class="auto-refresh-label" title="Automatically refresh every 30 seconds">
                    <input type="checkbox" id="auto-refresh-toggle">
                    <span>Auto-refresh</span>
                </label>
            </div>
            <div class="user-archive-controls">
                <div class="user-view-toggle" role="group" aria-label="User list view">
                    <button class="user-view-btn active" id="show-active-users-btn">Active</button>
                    <button class="user-view-btn" id="show-archived-users-btn">Archived</button>
                </div>
                <button class="action-btn archive-all-btn" id="archive-active-users-btn" title="Archive all active non-admin users">
                    Archive active students
                </button>
            </div>
            <div class="user-search-controls">
                <label for="users-search">Search users</label>
                <input type="search" id="users-search" class="form-input" placeholder="Name or email" autocomplete="off" aria-controls="users-list" aria-describedby="users-search-count">
                <div id="users-search-count" class="user-search-count" role="status" aria-live="polite"></div>
            </div>
            <div class="users-list" id="users-list">
                <!-- Users will be populated here -->
            </div>
        </div>

        <!-- Main content area -->
        <div class="admin-main">
            <!-- Welcome/Empty State -->
            <div id="admin-welcome" class="admin-welcome">
                <div class="welcome-content">
                    <h2>User Management</h2>
                    <p>Select a user to view their details and progress</p>
                </div>
            </div>

            <!-- User Details View -->
            <div id="user-details" class="user-details" style="display: none;">
                <div class="details-header">
                    <h2 id="user-details-title">User Details</h2>
                </div>

                <div class="admin-user-overview">
                    <section class="admin-user-character" aria-label="Saved character">
                        <h3>Character</h3>
                        <div id="admin-user-avatar" class="admin-user-avatar" aria-label="Selected user's character"></div>
                        <p id="admin-user-avatar-note">Saved outfit · Drag to rotate · Scroll to zoom</p>
                    </section>
                    <div class="user-info-section">
                        <h3>User Information</h3>
                        <div id="user-info-content"></div>
                    </div>

                </div>

                <div class="user-stats-section">
                    <h3>Statistics</h3>
                    <div id="user-stats-content"></div>
                </div>

                <div class="user-progress-section">
                    <h3>Exercise Progress</h3>
                    <div id="user-progress-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/shell/shell.min.js"></script>
    <script type="module" src="../../js/pages/admin/usersPage.js"></script>
</body>
</html>

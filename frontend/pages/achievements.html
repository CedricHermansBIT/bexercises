<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../js/utils/themeBootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITLab ~ achievements</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../achievements.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="hyprland-theme">
    <div id="achievements-screen" class="screen active">
        <div class="topbar">
            <div class="topbar-left">
                <button class="back-button" id="back-btn">
                    <span aria-hidden="true">←</span> back
                </button>
                <span class="workspace-indicator">[🏅]</span>
                <span class="app-title">Achievements</span>
            </div>
            <div class="topbar-center">
                <span class="topbar-subtitle" id="points-display">0 points</span>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn nav-destination nav-leaderboard" id="leaderboard-btn-achievements" title="View leaderboard rankings" aria-label="Leaderboard">
                    <span aria-hidden="true">📊</span>
                    <span class="nav-destination-label">Leaderboard</span>
                </button>
                <div class="online-users-navbar" id="online-users-navbar">
                    <button class="topbar-btn" id="online-users-btn" title="Online Users">
                        <span class="online-indicator-navbar"></span>
                        <span class="online-count-navbar">0</span>
                    </button>
                    <div class="online-users-dropdown" id="online-users-dropdown">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
                <button class="topbar-btn admin-only" id="admin-btn-achievements" title="Admin Panel" style="display: none;">
                    <span aria-hidden="true">⚙</span>
                </button>
                <span class="system-time" id="system-time">00:00</span>
                <div class="user-menu" id="user-menu">
                    <span class="user-icon account-avatar" aria-label="Account"></span>
                    <div class="user-dropdown">
                        <button class="dropdown-item" id="theme-toggle-btn">
                            <span class="theme-icon">☀️</span> <span class="theme-text">Light Mode</span>
                        </button>
                        <button class="dropdown-item" id="logout-btn">
                            <span aria-hidden="true">↪</span> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <main class="achievements-content">
            <div class="achievement-collection">
                <header class="collection-header">
                    <div><h1>Achievements</h1><p>Your milestones, next goals, and character rewards.</p></div>
                    <a href="avatar.html" class="achievement-character-entry">
                        <span id="achievement-character" class="achievement-character-avatar" aria-hidden="true"></span>
                        <span><strong>Character studio →</strong><small>Put your rewards to use</small></span>
                    </a>
                </header>
                <div class="collection-summary" aria-label="Achievement summary">
                    <span><strong id="earned-count">—</strong> of <strong id="total-count">—</strong> earned</span>
                    <progress id="collection-progress" value="0" max="100" aria-label="Overall achievement progress"></progress>
                    <span id="progress-percent">—</span>
                    <span id="collection-points">— points</span>
                </div>
                <div class="collection-toolbar">
                    <div class="collection-filters" role="group" aria-label="Achievement status">
                        <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                        <button class="filter-btn" data-filter="locked" aria-pressed="false">To earn</button>
                        <button class="filter-btn" data-filter="earned" aria-pressed="false">Earned</button>
                    </div>
                    <label class="collection-search"><span >Search achievements</span><input type="search" id="achievement-search" placeholder="Search achievements…"></label>
                    <label><span >Category</span><select id="achievement-category"><option value="all">All categories</option></select></label>
                </div>
                <p id="collection-results" class="collection-results" role="status" aria-live="polite">Loading achievements…</p>
                <div id="achievements-grid" class="collection-sections" aria-busy="true"></div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/pages/achievementsPage.js"></script>
</body>
</html>
